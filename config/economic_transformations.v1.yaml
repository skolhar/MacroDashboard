  gem_imports: {primary: yoy_pct, frequency: monthly, unit: pct_yoy, baseline_periods: 24, persistent_periods: 3, robust_deviation: 2.5, base_effect_drop_pct: 10}
  gem_exports: {primary: yoy_pct, frequency: monthly, unit: pct_yoy, baseline_periods: 24, persistent_periods: 3, robust_deviation: 2.5, base_effect_drop_pct: 10}
  gem_import_cover: {primary: first_difference, frequency: monthly, unit: months_change, baseline_periods: 24, persistent_periods: 3, robust_deviation: 2.5}
  usd_inr_yahoo: {primary: rolling_growth, frequency: business_daily, window: 20, unit: pct_20_sessions, baseline_periods: 40, persistent_periods: 5, robust_deviation: 3.0}
  brent_front_yahoo: {primary: rolling_growth, frequency: business_daily, window: 20, unit: pct_20_sessions, baseline_periods: 40, persistent_periods: 5, robust_deviation: 3.0}

  wdi_broad_money_gdp: {primary: first_difference, frequency: annual, unit: percentage_points, baseline_periods: 6, persistent_periods: 3, robust_deviation: 2.5}
  wdi_real_gdp_growth: {primary: first_difference, frequency: annual, unit: percentage_points, baseline_periods: 6, persistent_periods: 3, robust_deviation: 2.0}
  wdi_consumption_growth: {primary: first_difference, frequency: annual, unit: percentage_points, baseline_periods: 6, persistent_periods: 3, robust_deviation: 2.0}
  gem_cpi_index: {primary: yoy_pct, frequency: monthly, unit: pct_yoy, baseline_periods: 24, persistent_periods: 3, robust_deviation: 2.2, base_effect_drop_pct: 10}
  gem_iip: {primary: yoy_pct, frequency: monthly, unit: pct_yoy, baseline_periods: 24, persistent_periods: 3, robust_deviation: 2.5, base_effect_drop_pct: 10}
  gem_fx_rate: {primary: mom_pct, frequency: monthly, unit: pct_mom, baseline_periods: 24, persistent_periods: 3, robust_deviation: 2.5}

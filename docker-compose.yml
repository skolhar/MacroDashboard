services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-macro}
      POSTGRES_USER: ${POSTGRES_USER:-macro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ENV: ${APP_ENV:-demo}
      DEMO_MODE: ${DEMO_MODE:-true}
      ADMIN_TOKEN_SHA256: ${ADMIN_TOKEN_SHA256:-}
      MARKET_DATA_RESEARCH_ENABLED: ${MARKET_DATA_RESEARCH_ENABLED:-false}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - webui-shared
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      API_DOCS_URL: ${API_DOCS_URL:-http://localhost:8000/docs}
      RESEARCH_UI_USER: ${RESEARCH_UI_USER:-}
      RESEARCH_UI_PASSWORD: ${RESEARCH_UI_PASSWORD:-}
      RESEARCH_OPERATOR_TOKEN: ${RESEARCH_OPERATOR_TOKEN:-}
    depends_on: [api]
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - webui-shared
volumes:
  pgdata:

# api/web join the shared network so the common Caddy in open-webui can
# reverse-proxy to them by service name (see ~/open-webui/Caddyfile).
networks:
  webui-shared:
    external: true
    name: webui-shared
